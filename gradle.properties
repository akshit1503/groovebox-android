org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# AGP 9's "built-in Kotlin" support is incompatible with kapt (needed for Room's
# annotation processor, since KSP has no release yet supporting the Kotlin 2.4.x
# this project needs). Opting out keeps the classic org.jetbrains.kotlin.android
# + kapt setup working under the newer AGP/Gradle/compileSdk this migration needed.
android.builtInKotlin=false
android.newDsl=false
